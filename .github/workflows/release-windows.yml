name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Read project version
        id: version
        shell: bash
        run: echo "version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Build with PyInstaller
        run: uv run pyinstaller --noconfirm --distpath dist omazone.spec
      - name: Smoke test the bundled executable
        run: ./dist/Omazone/Omazone.exe --selftest
      - name: Bundle zip with SHA-256 checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Omazone -DestinationPath "Omazone-${{ steps.version.outputs.version }}-windows-x64.zip"
          $hash = (Get-FileHash "Omazone-${{ steps.version.outputs.version }}-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  Omazone-${{ steps.version.outputs.version }}-windows-x64.zip" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omazone-windows-x64
          path: |
            Omazone-*-windows-x64.zip
            SHA256SUMS.txt
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Omazone-*-windows-x64.zip
            SHA256SUMS.txt
