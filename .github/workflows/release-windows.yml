name: Windows build

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-windows.yml
      - .github/workflows/release-desktop.yml
      - .github/workflows/build-desktop.yml
      - omazone.spec
      - packaging/arch/**
      - pyproject.toml
      - uv.lock
      - src/omazone/**
      - tools/assemble_release_assets.py
      - tools/publish_windows_release.py
      - tests/test_release_assets.py
      - tests/test_windows_release.py

# Builds and tests only. The coordinated release workflow publishes every
# platform together, so one main merge produces one release update. Runs for the
# same ref are serialised because queue order is not assured.
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Read project version
        id: version
        shell: bash
        run: |
          version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match pyproject.toml version $version. Merge a matching version bump before pushing a release tag."
            exit 1
          fi
      - name: Test release publishing rules
        run: uv run pytest tests/test_windows_release.py tests/test_release_assets.py -q
      - name: Build with PyInstaller
        run: uv run pyinstaller --noconfirm --distpath dist omazone.spec
      - name: Smoke test the bundled executable
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/Omazone/Omazone.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Bundled executable selftest failed: $($process.ExitCode)" }
      - name: Record source and build identity
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $info = [ordered]@{
            platform = 'windows-x64'
            version = $env:APP_VERSION
            commit = $env:GITHUB_SHA
            source = "https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA"
            workflow_run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            ref = $env:GITHUB_REF
            event = $env:GITHUB_EVENT_NAME
          }
          $info | ConvertTo-Json | Set-Content BUILD-INFO.json -Encoding utf8
          Copy-Item BUILD-INFO.json dist/Omazone/BUILD-INFO.json
          Copy-Item LICENSE dist/Omazone/LICENSE.txt
      - name: Choose download filename
        id: bundle
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = if ($env:GITHUB_REF -like 'refs/tags/v*') { "Omazone-$env:APP_VERSION-windows-x64.zip" } else { 'Omazone-windows-x64.zip' }
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Stage bundle for the coordinated release
        shell: pwsh
        run: |
          $name = '${{ steps.bundle.outputs.name }}'
          Compress-Archive -Path dist/Omazone -DestinationPath $name
          New-Item -ItemType Directory -Force -Path staged/Omazone-windows-x64 | Out-Null
          Move-Item -Force $name, BUILD-INFO.json staged/Omazone-windows-x64/
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omazone-windows-x64
          retention-days: 3
          path: staged/Omazone-windows-x64
