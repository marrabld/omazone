name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install Qt and audio libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libportaudio2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
