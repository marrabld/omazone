[project]
name = "omazone"
version = "0.1.0"
description = "An offline spectral-matching DSP playground"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0", "scipy>=1.14", "soundfile>=0.13",
  "PySide6>=6.8", "pyqtgraph>=0.13", "sounddevice>=0.5",
]

[project.scripts]
omazone = "omazone.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 100
