[project]
name = "omazone"
version = "0.1.0"
description = "An offline spectral-matching DSP playground"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0", "scipy>=1.14", "soundfile>=0.13",
  "PySide6>=6.8", "pyqtgraph>=0.13", "sounddevice>=0.5",
]

[project.scripts]
omazone = "omazone.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_gui.py" = ["E402"]
"tests/test_workspace.py" = ["E402"]
"tools/*.py" = ["E402"]
